name: Windows preview build

on:
  push:
    branches:
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run tests
        run: dotnet test AcNote.sln --configuration Release
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build preview installer
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -Version 0.1.18 -Iscc "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: AcNote-preview-0.1.18
          path: artifacts/0.1.18/*
          if-no-files-found: error
